<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con HTML, CSS y JS</title>
    <!--Ícono de la página.-->
    <link rel="stylesheet" href="layout.css">
    <script src="layout.js"></script>
</head>
<body>

    <header>
        <!--Primer encabezado: presentación formal de la página.-->
        <h1>Registro de Usuario</h1>
    </header>

    <main id="inicio">
        <section id="servicios">
            <!--Segundo encabezado: sección secundaria de la página de inicio.-->
            <h2>Datos de contacto e información</h2>

            <!--párrafo: describe para qué sirve el formulario.-->
            <p>Ingresa tus datos por favor. Todos los campos son obligatorios.</p>
            
            <!-- Contenedor para mostrar los errores de validación -->
            <div id="mensajes-error" class="alerta-error"></div>

            <!--Formulario actualizado.-->
            <form id="miFormulario" novalidate>
                
                <!-- Nombre completo -->
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <!-- Correo electrónico -->
                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo">
                </div>

                <!-- Teléfono -->
                <div>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>

                <!-- Edad -->
                <div>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="1" max="120">
                </div>

                <!-- Contraseña -->
                <div>
                    <label for="contrasena">Contraseña (Mínimo 8 caracteres):</label>
                    <input type="password" id="contrasena" name="contrasena">
                </div>

                <!-- Fecha -->
                <div>
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha">
                </div>

                <!-- Lista desplegable (Select) -->
                <div>
                    <label for="pais">País de residencia:</label>
                    <select id="pais" name="pais">
                        <option value="">-- Selecciona una opción --</option>
                        <option value="mx">México</option>
                        <option value="co">Colombia</option>
                        <option value="es">España</option>
                        <option value="ar">Argentina</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <!-- Botones de opción (Radio) -->
                <div class="grupo-opciones">
                    <label>Género:</label>
                    <label class="opcion-inline">
                        <input type="radio" name="genero" value="masculino"> Masculino
                    </label>
                    <label class="opcion-inline">
                        <input type="radio" name="genero" value="femenino"> Femenino
                    </label>
                    <label class="opcion-inline">
                        <input type="radio" name="genero" value="prefiero_no_decir"> Prefiero no decirlo
                    </label>
                </div>

                <!-- Casillas de verificación (Checkbox) -->
                <div class="grupo-opciones">
                    <label>Áreas de interés:</label>
                    <label class="opcion-inline">
                        <input type="checkbox" name="intereses" value="tecnologia"> Tecnología
                    </label>
                    <label class="opcion-inline">
                        <input type="checkbox" name="intereses" value="deportes"> Deportes
                    </label>
                </div>

                <!-- Checkbox obligatorio -->
                <div class="grupo-opciones">
                    <label class="opcion-inline">
                        <input type="checkbox" id="terminos" name="terminos"> 
                        Acepto los términos y condiciones (Obligatorio)
                    </label>
                </div>

                <!--Botón para enviar la información.-->
                <div>
                    <button type="submit">Enviar Registro</button>
                </div>
            </form>
        </section>
    </main>

    <footer id="contacto">
        <!--Tercer encabezado: información sobre derechos de autor.-->
        <h3>Información de copyright</h3>
        <p>Derechos reservados © 2026.</p>
    </footer>

    <!-- Enlace al archivo de validaciones JavaScript -->
    <script src="script.js"></script>
</body>
</html>
